# Edson Sushi - Docker Compose de PRODUCAO
# Projeto independente do Carvalho Tech Oficinas: repositorio, imagem e
# container proprios, sem rede compartilhada. O PedroServe nao usa Traefik
# (apesar do que os arquivos do repo das Oficinas sugerem) - o ingresso real
# e Cloudflare Tunnel -> Nginx (host, porta 80) -> proxy_pass pra cada app em
# 127.0.0.1:<porta>, exatamente como o app das Oficinas ja funciona em
# 127.0.0.1:3000. Este container so publica sua porta em loopback; quem
# roteia /edson-sushi ate aqui e um location novo no Nginx (fora deste repo).
#
# Uso: docker compose -p edsonsushi -f docker-compose.prod.yml up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: carvalhotech/edsonsushi:latest
    container_name: edsonsushi-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
