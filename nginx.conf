server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sem cache "cego" em CDN/navegador: sempre revalida com o servidor antes
    # de reusar uma resposta salva. Evita o problema de deploy novo no ar mas
    # todo mundo continuar recebendo JS/CSS de horas atrás (Cloudflare cacheia
    # extensões estáticas por padrão, ignorando que o conteúdo mudou).
    add_header Cache-Control "no-cache, must-revalidate" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
