server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sem cache "cego" em CDN/navegador: sempre revalida com o servidor antes
    # de reusar uma resposta salva. Evita o problema de deploy novo no ar mas
    # todo mundo continuar recebendo JS/CSS de horas atrás (Cloudflare cacheia
    # extensões estáticas por padrão, ignorando que o conteúdo mudou).
    add_header Cache-Control "no-cache, must-revalidate" always;

    location / {
        # tenta o caminho exato, depois como pasta (index.html), depois com ".html"
        # no final - assim /admin funciona igual /admin.html, sem quebrar nenhum
        # link existente que já usa a extensão.
        try_files $uri $uri/ $uri.html =404;
    }
}
